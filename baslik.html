<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>Yolliyo</title>
<style>
  :root {
    --zemin: #12100e;
    --yuzey: #1c1916;
    --yuzey-ust: #24201c;
    --kenar: rgba(255, 245, 230, 0.08);
    --metin: #f4f1ec;
    --ikincil: #c6c1b9;
    --soluk: #8f8a83;
    --marka: #ffb400;
    --kritik: #e5534b;
  }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--zemin);
    color: var(--metin);
    font: 13px/1 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-app-region: drag;
    user-select: none;
    overflow: hidden;
    border-bottom: 1px solid rgba(255, 245, 230, 0.06);
    box-sizing: border-box;
  }
  .serit { display: flex; align-items: center; height: 100%; padding: 0 12px; gap: 6px; padding-right: 150px; /* pencere düğmeleri */ }
  button, .ara { -webkit-app-region: no-drag; font: inherit; color: inherit; }

  .marka { display: flex; align-items: center; gap: 8px; padding-right: 8px; }
  .marka svg { width: 15px; height: 18px; }
  .marka b { font-size: 13.5px; font-weight: 650; letter-spacing: -0.01em; }

  .ikon {
    width: 30px; height: 30px; border: 0; border-radius: 8px; background: transparent;
    display: grid; place-items: center; color: var(--ikincil); cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .ikon:hover:not(:disabled) { background: var(--yuzey-ust); color: var(--metin); }
  .ikon:disabled { color: #4d4944; cursor: default; }
  .ikon svg { width: 16px; height: 16px; }
  .donuyor svg { animation: don 0.9s linear infinite; }
  @keyframes don { to { transform: rotate(360deg); } }

  .orta { flex: 1; display: flex; justify-content: center; min-width: 0; }
  .ara {
    width: min(460px, 100%); height: 30px; border-radius: 9px;
    border: 1px solid var(--kenar); background: var(--yuzey);
    display: flex; align-items: center; gap: 8px; padding: 0 10px; box-sizing: border-box;
    color: var(--soluk); cursor: text; transition: border-color 0.15s, background 0.15s;
  }
  .ara:hover { border-color: rgba(255, 180, 0, 0.35); background: var(--yuzey-ust); }
  .ara svg { width: 15px; height: 15px; flex: none; }
  .ara span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
  kbd {
    font: 11px/1 "Segoe UI", system-ui, sans-serif; color: var(--soluk);
    padding: 3px 6px; border-radius: 5px; border: 1px solid var(--kenar); background: var(--zemin);
  }

  .sag { display: flex; align-items: center; gap: 6px; }
  .cip {
    height: 28px; border-radius: 8px; border: 1px solid var(--kenar); background: var(--yuzey);
    display: inline-flex; align-items: center; gap: 7px; padding: 0 10px; cursor: pointer;
    color: var(--ikincil); font-weight: 500; transition: background 0.15s, border-color 0.15s, opacity 0.3s;
    white-space: nowrap;
  }
  .cip:hover { background: var(--yuzey-ust); border-color: rgba(255, 245, 230, 0.16); color: var(--metin); }
  .cip b { color: var(--metin); font-weight: 650; font-variant-numeric: tabular-nums; }
  .cip svg { width: 14px; height: 14px; }
  .nokta { width: 7px; height: 7px; border-radius: 50%; background: var(--marka); box-shadow: 0 0 8px rgba(255, 180, 0, 0.6); }
  .sorun .nokta { background: var(--kritik); box-shadow: 0 0 8px rgba(229, 83, 75, 0.55); }
  .sorun.temiz .nokta { background: #3fa34d; box-shadow: none; }
  .gizli { display: none !important; }
  .parla { animation: parla 1.4s ease; }
  @keyframes parla { 0% { box-shadow: 0 0 0 0 rgba(255, 180, 0, 0.55); } 100% { box-shadow: 0 0 0 8px rgba(255, 180, 0, 0); } }

  @media (max-width: 1020px) { .marka b, .metinUzun { display: none; } }
  @media (max-width: 820px) { .depo span { display: none; } }
</style>
</head>
<body>
  <div class="serit">
    <div class="marka">
      <svg viewBox="0 0 100 120" aria-hidden="true"><path d="M5 5 L30 5 L50 48 L70 5 L95 5 L62 72 L62 115 L38 115 L38 72 Z" fill="#FFB400"/></svg>
      <b>Yolliyo</b>
    </div>
    <button class="ikon" id="geri" title="Geri (Alt+←)" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <button class="ikon" id="ileri" title="İleri (Alt+→)" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    </button>
    <button class="ikon" id="yenile" title="Yenile (F5)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>

    <div class="orta">
      <button class="ara" id="ara" title="Sipariş ara (Ctrl+Shift+Y)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Sipariş, müşteri, telefon ya da takip no ara…</span>
        <kbd>Ctrl Shift Y</kbd>
      </button>
    </div>

    <div class="sag" id="sayaclar">
      <button class="cip gizli" id="yeni" title="Yeni siparişler">
        <span class="nokta"></span> Yeni <b id="yeniSayi">0</b>
      </button>
      <button class="cip sorun gizli" id="sorun" title="Teslim edilemeyen kargolar">
        <span class="nokta"></span> <span class="metinUzun">Teslim edilemedi</span><span class="metinKisa"></span> <b id="sorunSayi">0</b>
      </button>
      <button class="cip depo" id="depo" title="Depo Ekranı (TV modu)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        <span>Depo Ekranı</span>
      </button>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const y = window.yolliyo;
  $("geri").onclick = () => y.geri();
  $("ileri").onclick = () => y.ileri();
  $("yenile").onclick = () => y.yenile();
  $("ara").onclick = () => y.aramaAc();
  $("depo").onclick = () => y.depoEkrani();
  $("yeni").onclick = () => y.git("/panel/siparisler");
  $("sorun").onclick = () => y.git("/panel/teslim-edilemeyen");

  const fmt = new Intl.NumberFormat("tr-TR");
  let onceki = { yeni: null, sorunlu: null };

  function sayac(el, sayiEl, deger, anahtar) {
    if (deger == null) { el.classList.add("gizli"); return; }
    el.classList.remove("gizli");
    sayiEl.textContent = fmt.format(deger);
    if (onceki[anahtar] != null && deger > onceki[anahtar]) {
      el.classList.remove("parla"); void el.offsetWidth; el.classList.add("parla");
    }
    onceki[anahtar] = deger;
  }

  y.durumDinle((d) => {
    $("geri").disabled = !d.geriVar;
    $("ileri").disabled = !d.ileriVar;
    $("yenile").classList.toggle("donuyor", Boolean(d.yukleniyor));
    $("depo").classList.toggle("gizli", !d.oturum);
    $("ara").style.visibility = d.oturum ? "visible" : "hidden";
    sayac($("yeni"), $("yeniSayi"), d.oturum ? d.yeni : null, "yeni");
    sayac($("sorun"), $("sorunSayi"), d.oturum ? d.sorunlu : null, "sorunlu");
    $("sorun").classList.toggle("temiz", d.sorunlu === 0);
  });
</script>
</body>
</html>
